name: Verify Sentinel
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run demo
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: local-evidence
          path: evidence/local-demo.json
